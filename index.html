<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <!-- viewport-fit=cover：讓畫面延伸到 iPhone 瀏海、圓角區域 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>每日打卡</title>

    <!-- 加到手機主畫面時用的設定 -->
    <meta name="theme-color" content="#f3f3f3">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="每日打卡">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <link rel="apple-touch-icon" href="icon-180.png">
    <link rel="icon" type="image/png" href="icon-192.png">
    <link rel="manifest" href="manifest.json">

    <!-- Lucide Icons 圖示庫：寫 <i data-lucide="圖示名稱"></i>，它就會變成圖示 -->
    <!-- 所有圖示名稱可以到 https://lucide.dev/icons 查 -->
    <script src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.min.js"></script>

    <style>
        /* ===== 顏色：統一寫在這裡，想換顏色只要改這幾行 ===== */
        :root {
            color-scheme: light dark; /* 讓日期選擇器等內建元件也跟著深淺色變化 */
            --bg: #ffffff;        /* 整個畫面的底色 */
            --card: #f3f3f3;      /* 灰色卡片 */
            --text: #1a1a1a;      /* 主要文字 */
            --muted: #8a8a8a;     /* 次要的灰色小字 */
            --line: #dddddd;      /* 進度條底色 */
            --undone: #c8c8c8;    /* 還沒完成的灰色圓點 */
            --accent: #f59e0b;    /* 火焰的橘色 */
        }

        /* 手機設定成深色模式時，自動換成深色 */
        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #121212;
                --card: #222222;
                --text: #f2f2f2;
                --muted: #9a9a9a;
                --line: #3a3a3a;
                --undone: #4a4a4a;
            }
        }

        * {
            box-sizing: border-box;
        }

        /* 有 hidden 的元素一定要藏起來（不然會被下面的 display: flex 蓋掉） */
        [hidden] {
            display: none !important;
        }

        body {
            margin: 0;
            background: var(--bg);
            color: var(--text);
            font-family: -apple-system, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
            -webkit-tap-highlight-color: transparent; /* 點按鈕時不要出現灰色方框 */
        }

        button {
            font: inherit;
            color: inherit;
            background: none;
            border: none;
            padding: 0;
            cursor: pointer;
        }

        svg {
            width: 20px;
            height: 20px;
            fill: none;
            stroke: currentColor;
            stroke-width: 2.4; /* 圖示線條粗細：數字越大越粗（Lucide 預設是 2） */
            stroke-linecap: round;
            stroke-linejoin: round;
            flex-shrink: 0;
        }

        .app {
            max-width: 420px; /* 電腦上看也不會拉得太寬 */
            margin: 0 auto;
            /* 上面避開瀏海；下面留空間給底部選單 */
            padding: calc(12px + env(safe-area-inset-top)) 16px calc(110px + env(safe-area-inset-bottom));
        }

        /* ===== 最上面：選單、標題、鈴鐺 ===== */
        .topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            height: 44px;
        }

        .topbar h1 {
            margin: 0;
            font-size: 18px;
            font-weight: 600;
        }

        .icon-btn {
            width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* ===== 日期和加油的話 ===== */
        .date {
            margin: 16px 0 6px;
            color: var(--muted);
            font-size: 14px;
        }

        .greeting {
            margin: 0 0 20px;
            font-size: 22px;
            font-weight: 700;
        }

        /* ===== 灰色大卡片（進度卡片、日曆都用這個） ===== */
        .card {
            background: var(--card);
            border-radius: 18px;
            padding: 18px 20px;
            margin-bottom: 28px;
        }

        .progress-top {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        .progress-label {
            margin: 0;
            font-size: 13px;
            color: var(--muted);
        }

        .progress-count {
            margin: 6px 0 0;
            font-size: 28px;
            font-weight: 700;
        }

        .flame {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: var(--bg);
            color: var(--accent);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .bar {
            height: 10px;
            border-radius: 5px;
            background: var(--line);
            margin: 14px 0 12px;
            overflow: hidden;
        }

        .bar-fill {
            height: 100%;
            width: 0%;
            border-radius: 5px;
            background: var(--text);
            transition: width 0.3s; /* 進度條長度改變時有動畫 */
        }

        .streak {
            margin: 0;
            font-size: 13px;
            color: var(--muted);
        }

        /* ===== 我的習慣、短期進度 ===== */
        .section-head {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .section-head h2 {
            margin: 0;
            font-size: 16px;
            font-weight: 600;
        }

        .habit-list {
            list-style: none;
            margin: 0 0 28px;
            padding: 0;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .habit {
            width: 100%;
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 16px;
            background: var(--card);
            border-radius: 14px;
            text-align: left;
            transition: transform 0.1s;
        }

        .habit:active {
            transform: scale(0.98); /* 按下去時縮小一點，有「按到了」的感覺 */
        }

        /* 短期目標還沒開始或已經結束：變淡、不能按 */
        .habit:disabled {
            opacity: 0.5;
            cursor: default;
            transform: none;
        }

        .habit-text {
            flex: 1;
            min-width: 0;
        }

        .habit-name {
            display: block;
            font-size: 15px;
        }

        .habit-note {
            display: block;
            margin-top: 4px;
            font-size: 11px;
            color: var(--muted);
        }

        /* 短期進度的時間進度條（比上面的細一點） */
        .goal-bar {
            height: 6px;
            margin: 8px 0 0;
        }

        /* 還沒完成：灰色實心圓點 */
        .dot {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: var(--undone);
            flex-shrink: 0;
        }

        .empty {
            color: var(--muted);
            text-align: center;
            padding: 20px 0;
            font-size: 14px;
        }

        /* ===== 日曆頁 ===== */
        .cal-head {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .cal-head h2 {
            margin: 0;
            font-size: 17px;
        }

        /* 一週 7 天，所以排成 7 欄 */
        .cal-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 6px;
            text-align: center;
        }

        .cal-weekday {
            font-size: 12px;
            color: var(--muted);
            padding-bottom: 4px;
        }

        .cal-day {
            aspect-ratio: 1; /* 寬高一樣，變成正方形 → 再加上圓角就是圓形 */
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
        }

        /* 有打卡的日子：黑底白字 */
        .cal-day.done {
            background: var(--text);
            color: var(--bg);
            font-weight: 600;
        }

        /* 今天：外面一圈框 */
        .cal-day.today {
            box-shadow: inset 0 0 0 2px var(--text);
        }

        .cal-day.done.today {
            box-shadow: 0 0 0 2px var(--bg), 0 0 0 4px var(--text);
        }

        /* 未來的日子：淡一點 */
        .cal-day.future {
            color: var(--muted);
        }

        /* 目前點選的日子：橘色外框 */
        .cal-day.selected {
            outline: 2px solid var(--accent);
            outline-offset: 2px;
        }

        .cal-summary {
            margin: 14px 0 0;
            font-size: 13px;
            color: var(--muted);
        }

        /* ===== 設定頁 ===== */
        .setting-row {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 14px 16px;
            background: var(--card);
            border-radius: 14px;
        }

        .edit-btn,
        .delete-btn {
            font-size: 14px;
            padding: 6px 4px;
            flex-shrink: 0;
        }

        .delete-btn {
            color: #dc2626;
        }

        .danger-btn {
            width: 100%;
            padding: 14px;
            border-radius: 14px;
            background: var(--card);
            color: #dc2626;
        }

        /* ===== 新增視窗 ===== */
        dialog {
            width: min(92vw, 380px);
            border: none;
            border-radius: 20px;
            padding: 22px 20px;
            background: var(--bg);
            color: var(--text);
        }

        dialog::backdrop {
            background: rgba(0, 0, 0, 0.4); /* 視窗後面變暗 */
        }

        dialog h3 {
            margin: 0 0 16px;
            font-size: 18px;
        }

        .field {
            display: block;
            margin-bottom: 14px;
            font-size: 13px;
            color: var(--muted);
        }

        .field input {
            display: block;
            width: 100%;
            margin-top: 6px;
            padding: 12px;
            border: 1px solid var(--line);
            border-radius: 10px;
            background: var(--card);
            color: var(--text);
            font: inherit;
            font-size: 16px; /* 16px 以上，iPhone 點輸入框時才不會自動放大畫面 */
        }

        .date-fields {
            display: flex;
            gap: 10px;
        }

        .date-fields .field {
            flex: 1;
            min-width: 0;
        }

        /* ===== 圖示下拉選單 ===== */
        /* 按鈕：顯示目前選的圖示 + 名字 + 向下箭頭 */
        .icon-select {
            width: 100%;
            margin-top: 6px;
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px;
            border: 1px solid var(--line);
            border-radius: 10px;
            background: var(--card);
            color: var(--text);
            font-size: 16px;
            text-align: left;
        }

        .icon-select .icon-select-name {
            flex: 1;
        }

        .icon-select .chevron {
            color: var(--muted);
            transition: transform 0.2s;
        }

        /* 選單打開時，箭頭轉成朝上 */
        .icon-select[aria-expanded="true"] .chevron {
            transform: rotate(180deg);
        }

        /* 打開後出現的圖示格子：一排 5 個 */
        .icon-menu {
            margin-top: 6px;
            padding: 8px;
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 4px;
            max-height: 220px;
            overflow-y: auto; /* 太多的話可以往下滑 */
            border: 1px solid var(--line);
            border-radius: 10px;
            background: var(--card);
        }

        .icon-option {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            padding: 8px 2px;
            border-radius: 8px;
            font-size: 11px;
            color: var(--text);
        }

        /* 目前選中的那個：黑底白字 */
        .icon-option.selected {
            background: var(--text);
            color: var(--bg);
        }

        .dialog-buttons {
            display: flex;
            gap: 10px;
            margin-top: 6px;
        }

        .dialog-buttons button {
            flex: 1;
            padding: 13px;
            border-radius: 12px;
            background: var(--card);
        }

        .dialog-buttons .primary {
            background: var(--text);
            color: var(--bg);
            font-weight: 600;
        }

        /* ===== 最下面的選單 ===== */
        .tabbar {
            position: fixed;
            left: 50%;
            transform: translateX(-50%);
            bottom: calc(12px + env(safe-area-inset-bottom));
            width: calc(100% - 32px);
            max-width: 388px;
            display: flex;
            justify-content: space-around;
            padding: 8px;
            background: var(--card);
            border-radius: 28px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.08);
        }

        .tab {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 3px;
            padding: 4px 0;
            font-size: 11px;
            color: var(--muted);
        }

        .tab.active {
            color: var(--text);
        }
    </style>
</head>
<body>

    <main class="app">
        <header class="topbar">
            <button class="icon-btn" aria-label="選單"><i data-lucide="menu"></i></button>
            <h1 id="page-title">今日</h1>
            <button class="icon-btn" aria-label="通知"><i data-lucide="bell"></i></button>
        </header>

        <!-- ===== 今日頁 ===== -->
        <section id="page-today">
            <p class="date" id="date"></p>
            <p class="greeting" id="greeting">今天也要繼續加油！</p>

            <div class="card">
                <div class="progress-top">
                    <div>
                        <p class="progress-label">今日完成進度</p>
                        <p class="progress-count" id="progress-count">0 / 0</p>
                    </div>
                    <div class="flame"><i data-lucide="flame"></i></div>
                </div>
                <div class="bar"><div class="bar-fill" id="bar-fill"></div></div>
                <p class="streak" id="streak">已連續打卡 0 天</p>
            </div>

            <div class="section-head">
                <h2>長期習慣</h2>
                <button class="icon-btn" id="add-habit-btn" aria-label="新增習慣"><i data-lucide="circle-plus"></i></button>
            </div>
            <ul class="habit-list" id="habit-list"></ul>

            <div class="section-head">
                <h2>短期進度</h2>
                <button class="icon-btn" id="add-goal-btn" aria-label="新增短期目標"><i data-lucide="circle-plus"></i></button>
            </div>
            <ul class="habit-list" id="goal-list"></ul>
        </section>

        <!-- ===== 日曆頁 ===== -->
        <section id="page-calendar" hidden>
            <div class="card" style="margin-top: 16px">
                <div class="cal-head">
                    <button class="icon-btn" id="prev-month" aria-label="上個月"><i data-lucide="chevron-left"></i></button>
                    <h2 id="cal-title"></h2>
                    <button class="icon-btn" id="next-month" aria-label="下個月"><i data-lucide="chevron-right"></i></button>
                </div>
                <div class="cal-grid">
                    <div class="cal-weekday">日</div>
                    <div class="cal-weekday">一</div>
                    <div class="cal-weekday">二</div>
                    <div class="cal-weekday">三</div>
                    <div class="cal-weekday">四</div>
                    <div class="cal-weekday">五</div>
                    <div class="cal-weekday">六</div>
                </div>
                <div class="cal-grid" id="cal-days"></div>
                <p class="cal-summary" id="cal-summary"></p>
            </div>

            <div class="section-head">
                <h2 id="day-title"></h2>
            </div>
            <ul class="habit-list" id="day-list"></ul>
        </section>

        <!-- ===== 統計頁（之後的階段再做） ===== -->
        <section id="page-stats" hidden>
            <p class="empty">📊 統計功能即將推出</p>
        </section>

        <!-- ===== 設定頁 ===== -->
        <section id="page-settings" hidden>
            <div class="section-head" style="margin-top: 16px">
                <h2>管理習慣與短期目標</h2>
            </div>
            <ul class="habit-list" id="manage-list"></ul>
            <button class="danger-btn" id="reset-btn">清除所有打卡紀錄</button>
        </section>
    </main>

    <!-- ===== 新增習慣 / 短期目標 的視窗 ===== -->
    <dialog id="add-dialog">
        <form id="add-form">
            <h3 id="dialog-title">新增習慣</h3>
            <label class="field">名稱
                <input id="input-name" required maxlength="30" placeholder="例如：冥想 10 分鐘">
            </label>
            <label class="field">小字說明（可以不填）
                <input id="input-note" maxlength="30" placeholder="例如：放鬆心情">
            </label>
            <!-- 圖示下拉選單：按一下打開，選好之後自動收起來 -->
            <div class="field">圖示
                <button type="button" class="icon-select" id="icon-select" aria-expanded="false">
                    <span id="icon-select-icon"></span>
                    <span class="icon-select-name" id="icon-select-name"></span>
                    <i data-lucide="chevron-down" class="chevron"></i>
                </button>
                <div class="icon-menu" id="icon-menu" hidden></div>
            </div>
            <!-- 只有短期目標才會顯示日期 -->
            <div class="date-fields" id="date-fields">
                <label class="field">開始日期
                    <input type="date" id="input-start">
                </label>
                <label class="field">結束日期
                    <input type="date" id="input-end">
                </label>
            </div>
            <div class="dialog-buttons">
                <button type="button" id="cancel-btn">取消</button>
                <button type="submit" class="primary" id="submit-btn">新增</button>
            </div>
        </form>
    </dialog>

    <nav class="tabbar">
        <button class="tab active" data-page="today"><i data-lucide="house"></i>今日</button>
        <button class="tab" data-page="calendar"><i data-lucide="calendar"></i>日曆</button>
        <button class="tab" data-page="stats"><i data-lucide="chart-no-axes-column"></i>統計</button>
        <button class="tab" data-page="settings"><i data-lucide="settings"></i>設定</button>
    </nav>

<script>
    // ===== 第一次使用時的預設習慣 =====
    // id：電腦用來分辨習慣的代號；icon：Lucide 圖示的名字（https://lucide.dev/icons）
    // 短期目標也放在同一個清單裡，只是多了 type: "goal"、start（開始日期）、end（結束日期）
    const DEFAULT_HABITS = [
        { id: "read",   name: "閱讀 30 分鐘",     note: "每日學習",     icon: "book-open" },
        { id: "sport",  name: "運動 20 分鐘",     note: "保持健康",     icon: "dumbbell" },
        { id: "eng",    name: "學習英文",         note: "每天 10 個單字", icon: "languages" },
        { id: "water",  name: "喝水 2000 ml",     note: "健康生活",     icon: "droplet" },
        { id: "sleep",  name: "晚上 11 點前睡覺", note: "規律作息",     icon: "moon" }
    ];

    // 舊版圖示名字 → Lucide 的名字（已經存在手機裡的舊資料才能顯示正確圖示）
    const OLD_ICON_NAMES = { book: "book-open", language: "languages", drop: "droplet" };

    const WEEKDAYS = ["日", "一", "二", "三", "四", "五", "六"];

    // ===== 讀取、儲存資料 =====
    // habits：習慣 + 短期目標清單（陣列）
    // records：每天完成了哪些項目，例如 { "2026-11-08": ["read", "sport"] }
    function loadHabits() {
        const saved = localStorage.getItem("habits");
        if (saved === null) {
            return DEFAULT_HABITS;
        }
        return JSON.parse(saved);
    }

    function saveHabits(habits) {
        localStorage.setItem("habits", JSON.stringify(habits));
    }

    function loadRecords() {
        const saved = localStorage.getItem("records");
        if (saved === null) {
            return {};
        }
        return JSON.parse(saved);
    }

    function saveRecords(records) {
        localStorage.setItem("records", JSON.stringify(records));
    }

    // ===== 日期小工具 =====

    // 把日期轉成 "2026-11-08" 這種文字，方便存起來和比較
    function toDateKey(date) {
        const year = date.getFullYear();
        const month = String(date.getMonth() + 1).padStart(2, "0"); // 月份從 0 開始，所以要 +1
        const day = String(date.getDate()).padStart(2, "0");
        return year + "-" + month + "-" + day;
    }

    // 反過來：把 "2026-11-08" 變回日期（時間是當天 00:00）
    function fromDateKey(key) {
        const parts = key.split("-");
        return new Date(Number(parts[0]), Number(parts[1]) - 1, Number(parts[2]));
    }

    // 兩個日期相差幾天
    function daysBetween(a, b) {
        return Math.round((b - a) / (24 * 60 * 60 * 1000));
    }

    // 「11 月 8 日，星期日」
    function formatDate(date) {
        return (date.getMonth() + 1) + " 月 " + date.getDate() + " 日，星期" + WEEKDAYS[date.getDay()];
    }

    // 某一天有沒有打卡（完成至少一個項目就算）
    function hasCheckin(records, date) {
        const done = records[toDateKey(date)];
        return done !== undefined && done.length > 0;
    }

    // 計算連續打卡天數
    function countStreak(records) {
        const day = new Date();

        // 今天還沒打卡的話，從昨天開始往回算（今天還有機會打，連續紀錄不算斷）
        if (!hasCheckin(records, day)) {
            day.setDate(day.getDate() - 1);
        }

        let count = 0;
        while (hasCheckin(records, day)) {
            count = count + 1;
            day.setDate(day.getDate() - 1);
        }
        return count;
    }

    // ===== 短期目標 =====

    function isGoal(item) {
        return item.type === "goal";
    }

    // 算出短期目標的時間進度
    // 回傳：active（今天在期間內嗎）、percent（進度條要多長）、text（顯示的文字）
    function goalInfo(goal) {
        const today = fromDateKey(toDateKey(new Date()));
        const start = fromDateKey(goal.start);
        const end = fromDateKey(goal.end);
        const total = daysBetween(start, end) + 1; // 頭尾都算，所以 +1
        const dayNumber = daysBetween(start, today) + 1; // 今天是第幾天

        if (dayNumber < 1) {
            return { active: false, percent: 0, text: "還有 " + (1 - dayNumber) + " 天開始 · 共 " + total + " 天" };
        }
        if (dayNumber > total) {
            return { active: false, percent: 100, text: "已結束 · 共 " + total + " 天" };
        }

        const left = total - dayNumber;
        let text = "第 " + dayNumber + " / " + total + " 天 · ";
        text = text + (left === 0 ? "今天是最後一天！" : "剩 " + left + " 天");
        return { active: true, percent: dayNumber / total * 100, text: text };
    }

    // 舊版（第 4 階段）只存「哪幾天有打卡」，把它搬到新的格式，連續天數才不會歸零
    function migrateOldData() {
        const old = localStorage.getItem("checkins");
        if (old === null) {
            return;
        }
        const records = loadRecords();
        JSON.parse(old).forEach(function(date) {
            if (records[date] === undefined) {
                records[date] = ["old-checkin"];
            }
        });
        saveRecords(records);
        localStorage.removeItem("checkins");
        localStorage.removeItem("lastCheckinTime");
        localStorage.removeItem("checkedIn");
    }

    // ===== 做出畫面上的小零件 =====

    // 做出一個小圖示，例如 makeIcon("book-open")
    // 先放一個 <i data-lucide="...">，等 render() 最後呼叫 lucide.createIcons() 才會變成真的圖示
    function makeIcon(name) {
        const icon = document.createElement("i");
        icon.setAttribute("data-lucide", OLD_ICON_NAMES[name] || name);
        return icon;
    }

    // 做出名稱 + 小字說明
    function makeHabitText(name, note) {
        const box = document.createElement("span");
        box.className = "habit-text";

        const nameEl = document.createElement("span");
        nameEl.className = "habit-name";
        nameEl.textContent = name; // 用 textContent，使用者打什麼字都會原樣顯示，不會被當成程式
        box.appendChild(nameEl);

        if (note) {
            const noteEl = document.createElement("span");
            noteEl.className = "habit-note";
            noteEl.textContent = note;
            box.appendChild(noteEl);
        }
        return box;
    }

    // 做出一個進度條，percent 是 0 ~ 100
    function makeBar(percent, extraClass) {
        const bar = document.createElement("span");
        bar.className = "bar " + extraClass;
        bar.style.display = "block";
        const fill = document.createElement("span");
        fill.className = "bar-fill";
        fill.style.display = "block";
        fill.style.width = percent + "%";
        bar.appendChild(fill);
        return bar;
    }

    // 做出一列可以點的項目（習慣、短期目標都用這個）
    function makeRow(item, isDone) {
        const button = document.createElement("button");
        button.className = "habit";
        button.appendChild(makeIcon(item.icon));

        if (isGoal(item)) {
            const info = goalInfo(item);
            // 有寫說明的話：「說明 · 第 7 / 21 天 · 剩 14 天」
            const text = makeHabitText(item.name, item.note ? item.note + " · " + info.text : info.text);
            text.appendChild(makeBar(info.percent, "goal-bar"));
            button.appendChild(text);
            button.disabled = !info.active; // 還沒開始或已結束，就不能打卡
        } else {
            button.appendChild(makeHabitText(item.name, item.note));
        }

        // 右邊：完成 → 打勾圖示；沒完成 → 灰色圓點
        if (isDone) {
            button.appendChild(makeIcon("circle-check"));
        } else {
            const dot = document.createElement("span");
            dot.className = "dot";
            button.appendChild(dot);
        }

        button.addEventListener("click", function() {
            toggleHabit(item.id);
        });

        const li = document.createElement("li");
        li.appendChild(button);
        return li;
    }

    function makeEmpty(text) {
        const li = document.createElement("li");
        li.className = "empty";
        li.textContent = text;
        return li;
    }

    // ===== 畫出每一頁 =====

    function renderToday() {
        const now = new Date();
        const habits = loadHabits();
        const records = loadRecords();
        const doneToday = records[toDateKey(now)] || [];

        const dailyHabits = habits.filter(function(h) { return !isGoal(h); });
        const goals = habits.filter(isGoal);

        document.getElementById("date").textContent = formatDate(now);

        // 今日進度：每天的習慣 + 今天在期間內的短期目標
        const todayItems = dailyHabits.concat(goals.filter(function(g) {
            return goalInfo(g).active;
        }));
        const doneCount = todayItems.filter(function(h) {
            return doneToday.includes(h.id);
        }).length;
        const total = todayItems.length;

        document.getElementById("progress-count").textContent = doneCount + " / " + total;
        document.getElementById("bar-fill").style.width =
            (total === 0 ? 0 : doneCount / total * 100) + "%";
        document.getElementById("streak").textContent = "已連續打卡 " + countStreak(records) + " 天";

        document.getElementById("greeting").textContent =
            (total > 0 && doneCount === total) ? "今天全部完成了，太棒了！🎉" : "今天也要繼續加油！";

        // 我的習慣
        const habitList = document.getElementById("habit-list");
        habitList.innerHTML = ""; // 先清空，再一個一個加回去
        if (dailyHabits.length === 0) {
            habitList.appendChild(makeEmpty("還沒有習慣，按右邊 ⊕ 新增一個吧"));
        }
        dailyHabits.forEach(function(habit) {
            habitList.appendChild(makeRow(habit, doneToday.includes(habit.id)));
        });

        // 短期進度
        const goalList = document.getElementById("goal-list");
        goalList.innerHTML = "";
        if (goals.length === 0) {
            goalList.appendChild(makeEmpty("還沒有短期目標，按右邊 ⊕ 新增一個吧"));
        }
        goals.forEach(function(goal) {
            goalList.appendChild(makeRow(goal, doneToday.includes(goal.id)));
        });
    }

    // 日曆現在顯示哪個月、點選了哪一天
    const calendarMonth = new Date();
    calendarMonth.setDate(1);
    let selectedDay = toDateKey(new Date());

    function renderCalendar() {
        const records = loadRecords();
        const habits = loadHabits();
        const year = calendarMonth.getFullYear();
        const month = calendarMonth.getMonth();
        const todayKey = toDateKey(new Date());

        document.getElementById("cal-title").textContent = year + " 年 " + (month + 1) + " 月";

        const grid = document.getElementById("cal-days");
        grid.innerHTML = "";

        // 1 號之前的空格（例如 1 號是星期三，前面就要空 3 格）
        const firstWeekday = new Date(year, month, 1).getDay();
        for (let i = 0; i < firstWeekday; i++) {
            grid.appendChild(document.createElement("span"));
        }

        // 這個月有幾天：下個月的第 0 天 = 這個月的最後一天
        const daysInMonth = new Date(year, month + 1, 0).getDate();
        let checkinDays = 0;

        for (let d = 1; d <= daysInMonth; d++) {
            const date = new Date(year, month, d);
            const key = toDateKey(date);

            const cell = document.createElement("button");
            cell.className = "cal-day";
            cell.textContent = d;

            if (hasCheckin(records, date)) {
                cell.classList.add("done");
                checkinDays = checkinDays + 1;
            }
            if (key === todayKey) {
                cell.classList.add("today");
            }
            if (key > todayKey) {
                cell.classList.add("future"); // "2026-11-09" > "2026-11-08"，日期文字可以直接比大小
            }
            if (key === selectedDay) {
                cell.classList.add("selected");
            }

            cell.addEventListener("click", function() {
                selectedDay = key;
                render();
            });
            grid.appendChild(cell);
        }

        document.getElementById("cal-summary").textContent = "這個月打卡 " + checkinDays + " 天";

        // 下面列出點選那天完成了什麼
        document.getElementById("day-title").textContent = formatDate(fromDateKey(selectedDay));
        const list = document.getElementById("day-list");
        list.innerHTML = "";
        const doneIds = records[selectedDay] || [];

        if (doneIds.length === 0) {
            list.appendChild(makeEmpty("這天沒有打卡"));
        }
        doneIds.forEach(function(id) {
            const item = habits.find(function(h) { return h.id === id; });
            const row = document.createElement("li");
            row.className = "setting-row";
            if (item) {
                row.appendChild(makeIcon(item.icon));
                row.appendChild(makeHabitText(item.name, isGoal(item) ? "短期目標" : item.note));
            } else {
                // 舊版的打卡，或已經被刪掉的習慣
                row.appendChild(makeIcon("circle-check"));
                row.appendChild(makeHabitText(id === "old-checkin" ? "有打卡" : "已刪除的項目", id === "old-checkin" ? "舊版紀錄" : ""));
            }
            list.appendChild(row);
        });
    }

    function renderSettings() {
        const habits = loadHabits();
        const list = document.getElementById("manage-list");
        list.innerHTML = "";

        if (habits.length === 0) {
            list.appendChild(makeEmpty("沒有任何項目"));
        }

        habits.forEach(function(item) {
            const row = document.createElement("li");
            row.className = "setting-row";
            row.appendChild(makeIcon(item.icon));

            let note = item.note;
            if (isGoal(item)) {
                note = "短期目標 · " + item.start.slice(5).replace("-", "/") + " ~ " + item.end.slice(5).replace("-", "/");
            }
            row.appendChild(makeHabitText(item.name, note));

            const edit = document.createElement("button");
            edit.className = "edit-btn";
            edit.textContent = "編輯";
            edit.addEventListener("click", function() {
                openAddDialog(isGoal(item) ? "goal" : "habit", item);
            });
            row.appendChild(edit);

            const del = document.createElement("button");
            del.className = "delete-btn";
            del.textContent = "刪除";
            del.addEventListener("click", function() {
                deleteHabit(item);
            });
            row.appendChild(del);

            list.appendChild(row);
        });
    }

    function render() {
        renderToday();
        renderCalendar();
        renderSettings();
        drawIcons();
    }

    // 把畫面上所有 <i data-lucide="..."> 換成 Lucide 圖示
    // （如果沒有網路、圖示庫載不到，就跳過，App 還是能用）
    function drawIcons() {
        if (window.lucide) {
            lucide.createIcons();
        }
    }

    // ===== 動作 =====

    // 點一下：沒完成 → 完成；已完成 → 取消（按錯可以反悔）
    function toggleHabit(id) {
        const records = loadRecords();
        const today = toDateKey(new Date());
        const doneToday = records[today] || [];

        if (doneToday.includes(id)) {
            records[today] = doneToday.filter(function(x) { return x !== id; });
        } else {
            doneToday.push(id);
            records[today] = doneToday;
        }

        if (records[today].length === 0) {
            delete records[today]; // 一個都沒完成，就把這天刪掉，不算打卡
        }

        saveRecords(records);
        render();
    }

    function deleteHabit(item) {
        if (!confirm("確定要刪除「" + item.name + "」嗎？")) {
            return;
        }
        const habits = loadHabits().filter(function(h) {
            return h.id !== item.id;
        });
        saveHabits(habits);
        render();
    }

    // ===== 圖示下拉選單 =====
    // 可以選的圖示：name 是 Lucide 的名字，label 是顯示的中文
    // 想加更多圖示：到 https://lucide.dev/icons 找名字，照格式加一行就好
    const ICON_OPTIONS = [
        { name: "star",           label: "星星" },
        { name: "target",         label: "目標" },
        { name: "book-open",      label: "閱讀" },
        { name: "pencil",         label: "寫字" },
        { name: "graduation-cap", label: "學習" },
        { name: "languages",      label: "語言" },
        { name: "code",           label: "程式" },
        { name: "brain",          label: "思考" },
        { name: "dumbbell",       label: "健身" },
        { name: "footprints",     label: "走路" },
        { name: "bike",           label: "騎車" },
        { name: "heart",          label: "健康" },
        { name: "droplet",        label: "喝水" },
        { name: "apple",          label: "水果" },
        { name: "salad",          label: "飲食" },
        { name: "coffee",         label: "咖啡" },
        { name: "pill",           label: "吃藥" },
        { name: "moon",           label: "睡覺" },
        { name: "bed",            label: "休息" },
        { name: "sun",            label: "早起" },
        { name: "smile",          label: "心情" },
        { name: "music",          label: "音樂" },
        { name: "guitar",         label: "樂器" },
        { name: "camera",         label: "拍照" },
        { name: "sprout",         label: "成長" },
        { name: "flower-2",       label: "植物" },
        { name: "dog",            label: "寵物" },
        { name: "piggy-bank",     label: "存錢" },
        { name: "briefcase",      label: "工作" }
    ];

    const iconSelect = document.getElementById("icon-select");
    const iconMenu = document.getElementById("icon-menu");
    let selectedIcon = "star"; // 目前選的圖示

    // 選一個圖示：更新按鈕上的圖示和名字、標出選中的格子
    function chooseIcon(name) {
        selectedIcon = name;
        const option = ICON_OPTIONS.find(function(o) { return o.name === name; });

        const iconBox = document.getElementById("icon-select-icon");
        iconBox.innerHTML = "";
        iconBox.appendChild(makeIcon(name));
        document.getElementById("icon-select-name").textContent = option ? option.label : name;

        iconMenu.querySelectorAll(".icon-option").forEach(function(btn) {
            btn.classList.toggle("selected", btn.dataset.icon === name);
        });
        drawIcons();
    }

    function toggleIconMenu(open) {
        iconMenu.hidden = !open;
        iconSelect.setAttribute("aria-expanded", open ? "true" : "false");
    }

    // 一開始就把所有圖示格子做好
    ICON_OPTIONS.forEach(function(option) {
        const btn = document.createElement("button");
        btn.type = "button"; // 不寫的話，在 form 裡按下去會被當成「送出」
        btn.className = "icon-option";
        btn.dataset.icon = option.name;
        btn.appendChild(makeIcon(option.name));
        btn.appendChild(document.createTextNode(option.label));
        btn.addEventListener("click", function() {
            chooseIcon(option.name);
            toggleIconMenu(false); // 選好就收起來
        });
        iconMenu.appendChild(btn);
    });

    iconSelect.addEventListener("click", function() {
        toggleIconMenu(iconMenu.hidden); // 關著就打開，開著就關掉
    });

    // ===== 新增 / 編輯視窗（共用同一個視窗） =====
    const dialog = document.getElementById("add-dialog");
    let addingType = "habit"; // 現在要新增的是 "habit"（習慣）還是 "goal"（短期目標）
    let editingId = null;     // 正在編輯哪一個項目的 id；null 代表是「新增」

    // type："habit" 或 "goal"
    // item：要編輯的項目；不給的話就是「新增」
    function openAddDialog(type, item) {
        addingType = type;
        editingId = item ? item.id : null;
        const isEdit = (item !== undefined);
        const typeName = type === "goal" ? "短期目標" : "習慣";

        document.getElementById("add-form").reset(); // 清空上次打的字
        toggleIconMenu(false);
        document.getElementById("dialog-title").textContent = (isEdit ? "編輯" : "新增") + typeName;
        document.getElementById("submit-btn").textContent = isEdit ? "儲存" : "新增";
        document.getElementById("date-fields").hidden = (type !== "goal");
        document.getElementById("input-name").placeholder =
            type === "goal" ? "請輸入名稱" : "請輸入名稱";

        if (isEdit) {
            // 編輯：把原本的內容填進去
            document.getElementById("input-name").value = item.name;
            document.getElementById("input-note").value = item.note || "";
            chooseIcon(OLD_ICON_NAMES[item.icon] || item.icon);
            if (type === "goal") {
                document.getElementById("input-start").value = item.start;
                document.getElementById("input-end").value = item.end;
            }
        } else {
            // 新增：用預設值
            chooseIcon(type === "goal" ? "target" : "star");

            // 短期目標預設：今天開始，21 天
            const start = new Date();
            const end = new Date();
            end.setDate(end.getDate() + 20);
            document.getElementById("input-start").value = toDateKey(start);
            document.getElementById("input-end").value = toDateKey(end);
        }

        dialog.showModal();
    }

    document.getElementById("add-form").addEventListener("submit", function(event) {
        event.preventDefault(); // 不要讓表單重新整理頁面

        const name = document.getElementById("input-name").value.trim();
        const note = document.getElementById("input-note").value.trim();
        if (name === "") {
            return;
        }

        const newItem = {
            id: "h" + Date.now(), // 用現在的時間當代號，保證不會重複
            name: name,
            note: note,
            icon: selectedIcon // 下拉選單選的圖示
        };

        if (addingType === "goal") {
            const start = document.getElementById("input-start").value;
            const end = document.getElementById("input-end").value;
            if (start === "" || end === "") {
                alert("請選擇開始和結束日期");
                return;
            }
            if (end < start) {
                alert("結束日期不能比開始日期早");
                return;
            }
            newItem.type = "goal";
            newItem.start = start;
            newItem.end = end;
        }

        const habits = loadHabits();

        if (editingId === null) {
            habits.push(newItem); // 新增：加到清單最後面
        } else {
            // 編輯：找到原本那一個，換掉內容（id 不變，所以以前的打卡紀錄都還在）
            const index = habits.findIndex(function(h) { return h.id === editingId; });
            newItem.id = editingId;
            habits[index] = newItem;
        }

        saveHabits(habits);
        dialog.close();
        render();
    });

    document.getElementById("cancel-btn").addEventListener("click", function() {
        dialog.close();
    });

    document.getElementById("add-habit-btn").addEventListener("click", function() {
        openAddDialog("habit");
    });

    document.getElementById("add-goal-btn").addEventListener("click", function() {
        openAddDialog("goal");
    });

    // ===== 日曆：上個月、下個月 =====
    document.getElementById("prev-month").addEventListener("click", function() {
        calendarMonth.setMonth(calendarMonth.getMonth() - 1);
        render();
    });

    document.getElementById("next-month").addEventListener("click", function() {
        calendarMonth.setMonth(calendarMonth.getMonth() + 1);
        render();
    });

    // ===== 底部選單：切換頁面 =====
    const PAGE_TITLES = { today: "今日", calendar: "日曆", stats: "統計", settings: "設定" };

    document.querySelectorAll(".tab").forEach(function(tab) {
        tab.addEventListener("click", function() {
            const page = tab.dataset.page;

            document.querySelectorAll(".tab").forEach(function(t) {
                t.classList.toggle("active", t === tab);
            });
            Object.keys(PAGE_TITLES).forEach(function(name) {
                document.getElementById("page-" + name).hidden = (name !== page);
            });
            document.getElementById("page-title").textContent = PAGE_TITLES[page];
            window.scrollTo(0, 0);
        });
    });

    document.getElementById("reset-btn").addEventListener("click", function() {
        if (confirm("確定要清除所有打卡紀錄嗎？（習慣清單會保留）")) {
            localStorage.removeItem("records");
            render();
        }
    });

    // 手機上 App 常常一直開著不關，切回來時重新畫一次，跨過半夜就會自動變成新的一天
    document.addEventListener("visibilitychange", function() {
        if (document.visibilityState === "visible") {
            render();
        }
    });

    // ===== 開始 =====
    migrateOldData();
    render();
</script>
</body>
</html>
